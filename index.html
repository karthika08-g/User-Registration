
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #77797d;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: #050505;
            color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        h1, h2 {
            text-align: center;
            color: #a66cff;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 15px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        label {
            color: #e2e0e6;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        input:focus, select:focus, textarea:focus {
            outline: 2px solid #8331f6;
            border-color: #8331f6;
        }

        button {
            padding: 11px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .register-btn {
            width: 100%;
            margin-top: 20px;
            background: #8331f6;
            color: white;
        }

        .register-btn:hover {
            background: #6b20d5;
        }

        .message {
            text-align: center;
            color: #8df5a4;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            min-width: 1100px;
            border-collapse: collapse;
            background: white;
            color: #222;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
            overflow-wrap: anywhere;
        }

        th {
            background: #8331f6;
            color: white;
        }

        tbody tr:nth-child(even) {
            background: #f1ecfa;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
        }

        .delete-btn:hover {
            background: #b02a37;
        }

        .note {
            color: #ccc;
            font-size: 13px;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            .container {
                padding: 18px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Student Registration System</h1>

        <form id="studentForm">
            <div class="form-grid">

                <div class="field">
                    <label for="name">Student Name</label>
                    <input type="text" id="name" required
                           placeholder="Enter student name">
                </div>

                <div class="field">
                    <label for="rollno">Roll Number</label>
                    <input type="text" id="rollno" required
                           placeholder="Enter roll number">
                </div>

                <div class="field">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" required>
                </div>

                <div class="field">
                    <label for="course">Course</label>
                    <select id="course" required>
                        <option value="">Select course</option>
                        <option value="CSE">Computer Science Engineering</option>
                        <option value="IT">Information Technology</option>
                        <option value="ECE">Electronics and Communication</option>
                        <option value="EEE">Electrical and Electronics</option>
                        <option value="MECH">Mechanical Engineering</option>
                        <option value="CIVIL">Civil Engineering</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" required
                           placeholder="student@example.com">
                </div>

                <div class="field">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" required
                           maxlength="15" placeholder="Enter mobile number">
                </div>

                <div class="field full-width">
                    <label for="address">Address</label>
                    <textarea id="address" required
                              placeholder="Enter full address"></textarea>
                </div>

                <div class="field">
                    <label for="country">Country</label>
                    <select id="country" required>
                        <option value="">Select country</option>
                        <option value="India">India</option>
                        <option value="USA">United States</option>
                        <option value="UK">United Kingdom</option>
                        <option value="Canada">Canada</option>
                        <option value="Australia">Australia</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="field">
                    <label for="countryId">Country ID / Code</label>
                    <input type="text" id="countryId" required
                           placeholder="Example: IN">
                </div>

                <div class="field full-width">
                    <label for="password">Account Password</label>
                    <input type="password" id="password" minlength="6"
                           required placeholder="At least 6 characters">
                </div>

            </div>

            <button type="submit" class="register-btn">
                Register Student
            </button>

            <p id="message" class="message" role="status"></p>
        </form>

        <p class="note">
            Demo project: student details are saved only in this browser.
            Do not enter real passwords or sensitive personal information.
        </p>

        <h2>Registered Students</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>S.No</th>
                        <th>Name</th>
                        <th>Roll No</th>
                        <th>DOB</th>
                        <th>Course</th>
                        <th>Email</th>
                        <th>Mobile</th>
                        <th>Address</th>
                        <th>Country</th>
                        <th>Country ID</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="studentTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        const form = document.getElementById("studentForm");
        const table = document.getElementById("studentTable");
        const message = document.getElementById("message");

        // Load saved students from this browser
        let students = [];

        try {
            const savedData = localStorage.getItem("students");
            students = savedData ? JSON.parse(savedData) : [];

            if (!Array.isArray(students)) {
                students = [];
            }
        } catch (error) {
            students = [];
        }

        function saveStudents() {
            try {
                localStorage.setItem("students", JSON.stringify(students));
                return true;
            } catch (error) {
                message.textContent =
                    "Unable to save. Browser storage may be full or unavailable.";
                return false;
            }
        }

        function addCell(row, value) {
            const cell = row.insertCell();
            cell.textContent = value ?? "";
        }

        function displayStudents() {
            table.replaceChildren();

            students.forEach((student, index) => {
                const row = table.insertRow();

                addCell(row, index + 1);
                addCell(row, student.name);
                addCell(row, student.rollno);
                addCell(row, student.dob);
                addCell(row, student.course);
                addCell(row, student.email);
                addCell(row, student.mobile);
                addCell(row, student.address);
                addCell(row, student.country);
                addCell(row, student.countryId);

                const actionCell = row.insertCell();
                const deleteButton = document.createElement("button");

                deleteButton.textContent = "Delete";
                deleteButton.className = "delete-btn";

                deleteButton.addEventListener("click", () => {
                    const previousStudents = [...students];

                    students.splice(index, 1);

                    if (saveStudents()) {
                        displayStudents();
                        message.textContent = "Student deleted.";
                    } else {
                        students = previousStudents;
                    }
                });

                actionCell.appendChild(deleteButton);
            });
        }

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const student = {
                name: document.getElementById("name").value.trim(),
                rollno: document.getElementById("rollno").value.trim(),
                dob: document.getElementById("dob").value,
                course: document.getElementById("course").value,
                email: document.getElementById("email").value.trim(),
                mobile: document.getElementById("mobile").value.trim(),
                address: document.getElementById("address").value.trim(),
                country: document.getElementById("country").value,
                countryId: document.getElementById("countryId").value.trim()
            };

            if (students.some(
                item => item.rollno.toLowerCase() === student.rollno.toLowerCase()
            )) {
                message.textContent = "This roll number is already registered.";
                return;
            }

            // Never save the account password in localStorage.
            students.push(student);

            if (!saveStudents()) {
                students.pop();
                return;
            }

            displayStudents();
            form.reset();
            message.textContent = "Student registered successfully!";
        });

        displayStudents();
    </script>
</body>
</html>
